name: Refresh profile assets

# Regenerates every image the README depends on. The stat cards are rendered
# from the GitHub API by .github/scripts/gen_stats.py and committed here, so
# the profile never breaks when a third-party widget host goes down.

on:
  schedule:
    - cron: "17 3 * * *"        # daily, 03:17 UTC
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"
      - ".github/scripts/gen_stats.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stat cards
        env:
          # PROFILE_TOKEN (a PAT with `repo` + `read:user`) also counts work in
          # private organisations. Falls back to the default token, which sees
          # public activity only.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/gen_stats.py

      - name: Generate contribution snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit refreshed assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "assets unchanged"
          else
            git commit -m "chore: refresh profile assets"
            git push
          fi
