<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Arnab Jena - Full-Stack and Platform Engineer">
  <title>Arnab Jena — Full-Stack &amp; Platform Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="35%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="85%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a21caf" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a21caf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ab4ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}

    @keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,34px)}}
    @keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,40px)}}
    @keyframes floatC{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-38px)}}
    .bA{animation:floatA 14s ease-in-out infinite}
    .bB{animation:floatB 18s ease-in-out infinite}
    .bC{animation:floatC 11s ease-in-out infinite}

    @keyframes sweep{0%{transform:translateX(-420px)}100%{transform:translateX(1240px)}}
    .beam{animation:sweep 7s linear infinite}

    @keyframes drawRule{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
    .rule{transform-origin:0 0;animation:drawRule 1.5s cubic-bezier(.2,.8,.2,1) .45s both}

    @keyframes fadeUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
    .u1{opacity:0;animation:fadeUp .7s ease-out .15s forwards}
    .u2{opacity:0;animation:fadeUp .7s ease-out .35s forwards}
    .u3{opacity:0;animation:fadeUp .7s ease-out .55s forwards}
    .u4{opacity:0;animation:fadeUp .7s ease-out .75s forwards}

    @keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
    .caret{animation:blink 1.1s steps(1) infinite}

    @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.85}}
    .s{animation:twinkle 3.4s ease-in-out infinite}

    @keyframes spinCW{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes spinCCW{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
    .ring1{animation:spinCW 26s linear infinite}
    .ring2{animation:spinCCW 34s linear infinite}
    .ring3{animation:spinCW 44s linear infinite}

    @keyframes pulse{0%,100%{r:4;opacity:.9}50%{r:7;opacity:.35}}
    .core{animation:pulse 2.8s ease-in-out infinite}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <g class="bA"><ellipse cx="180" cy="90" rx="300" ry="200" fill="url(#glowA)"/></g>
    <g class="bB"><ellipse cx="980" cy="270" rx="320" ry="210" fill="url(#glowB)"/></g>
    <g class="bC"><ellipse cx="620" cy="40" rx="260" ry="170" fill="url(#glowC)"/></g>

    <g class="beam"><rect x="0" y="0" width="300" height="340" fill="url(#beam)"/></g>

    <g fill="#cfe3ff">
      <circle class="s" cx="95"  cy="250" r="1.6" style="animation-delay:.0s"/>
      <circle class="s" cx="240" cy="292" r="1.2" style="animation-delay:.5s"/>
      <circle class="s" cx="430" cy="58"  r="1.5" style="animation-delay:1.1s"/>
      <circle class="s" cx="560" cy="300" r="1.3" style="animation-delay:1.7s"/>
      <circle class="s" cx="690" cy="70"  r="1.6" style="animation-delay:2.2s"/>
      <circle class="s" cx="1120" cy="120" r="1.4" style="animation-delay:.8s"/>
      <circle class="s" cx="1050" cy="60" r="1.2" style="animation-delay:1.4s"/>
    </g>

    <!-- rotating tech orbit -->
    <g transform="translate(1010,170)">
      <g class="ring3">
        <circle r="122" fill="none" stroke="#7dd3fc" stroke-opacity="0.13" stroke-width="1" stroke-dasharray="3 7"/>
      </g>
      <g class="ring1">
        <circle r="92" fill="none" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="1.2"/>
        <circle cx="92"  cy="0"   r="3.6" fill="#a78bfa"/>
        <circle cx="-92" cy="0"   r="2.6" fill="#7dd3fc"/>
        <circle cx="0"   cy="92"  r="2.6" fill="#f472b6"/>
        <circle cx="0"   cy="-92" r="3.0" fill="#fbbf24"/>
      </g>
      <g class="ring2">
        <circle r="58" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="46 22"/>
        <circle cx="41" cy="41" r="3.2" fill="#34d399"/>
        <circle cx="-41" cy="-41" r="2.4" fill="#7dd3fc"/>
      </g>
      <circle class="core" r="4" fill="#e0f2fe"/>
      <circle r="14" fill="none" stroke="#e0f2fe" stroke-opacity="0.25" stroke-width="1"/>
    </g>

    <!-- text block -->
    <g transform="translate(72,86)">
      <text class="mono u1" x="0" y="0" font-size="13" letter-spacing="3.4" fill="#7dd3fc">
        IIT KHARAGPUR<tspan fill="#41547a"> · </tspan>AEROSPACE<tspan fill="#41547a"> · </tspan>MINORS IN AI &amp; CSE
      </text>

      <text class="sans u2" x="-2" y="72" font-size="66" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)">ARNAB JENA</text>

      <g class="rule"><rect x="0" y="94.8" width="520" height="2.6" rx="1.3" fill="url(#rule)"/></g>

      <text class="sans u3" x="0" y="130" font-size="23" font-weight="600" fill="#e6edf7">
        Full-Stack &amp; Platform Engineer<tspan class="caret" fill="#38bdf8" dx="6">_</tspan>
      </text>

      <text class="mono u4" x="0" y="164" font-size="14.5" fill="#8fa4c4">
        databases <tspan fill="#f472b6">→</tspan> backends <tspan fill="#f472b6">→</tspan> deploy pipelines <tspan fill="#41547a">//</tspan> shipped to production
      </text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#243352" stroke-width="1"/>
  </g>
</svg>
