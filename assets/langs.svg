<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" role="img" aria-label="Language distribution">
  <title>Language distribution</title>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a101c"/><stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cclip"><rect width="620" height="330" rx="16"/></clipPath>

  </defs>
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @keyframes rise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes glow{0%,100%{opacity:.30}50%{opacity:.70}}
    .halo{animation:glow 6s ease-in-out infinite}

    @keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
</style>
  <g clip-path="url(#cclip)">
    <rect width="620" height="330" fill="url(#cbg)"/>
    <ellipse class="halo" cx="580" cy="-10" rx="240" ry="150" fill="url(#halo)"/>
    <text class="mono" x="26" y="34" font-size="11.5" letter-spacing="2.6" fill="#5c78a8">ACROSS 24 REPOSITORIES  ·  OWNED + CONTRIBUTED</text>
    <text class="sans" x="26" y="60" font-size="20" font-weight="700" fill="#e6edf7">Language distribution</text>
    <rect x="26" y="72" width="54" height="3" rx="1.5" fill="url(#accent)"/>
    <rect x="26" y="100" width="568" height="16" rx="8" fill="#0e1626" stroke="#1c2942"/>
    <clipPath id="barclip"><rect x="26" y="100" width="568" height="16" rx="8"/></clipPath>
    <g clip-path="url(#barclip)">
      <rect x="26.0" y="100" width="250.6" height="16" fill="#3572A5" style="transform-origin:26.0px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.00s both"/>
      <rect x="276.6" y="100" width="156.3" height="16" fill="#3178c6" style="transform-origin:276.6px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.06s both"/>
      <rect x="432.9" y="100" width="90.7" height="16" fill="#f1e05a" style="transform-origin:432.9px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.12s both"/>
      <rect x="523.6" y="100" width="65.6" height="16" fill="#3d8137" style="transform-origin:523.6px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.18s both"/>
      <rect x="589.3" y="100" width="3.8" height="16" fill="#336790" style="transform-origin:589.3px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.24s both"/>
      <rect x="593.0" y="100" width="0.5" height="16" fill="#178600" style="transform-origin:593.0px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.30s both"/>
      <rect x="593.6" y="100" width="0.4" height="16" fill="#7dd3fc" style="transform-origin:593.6px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.36s both"/>
    </g>
    <g style="opacity:0;animation:rise .55s ease-out 0.00s forwards"><circle cx="33" cy="158" r="5.5" fill="#3572A5"/><text class="sans" x="48" y="163" font-size="14" font-weight="600" fill="#dbe6f5">Python</text><text class="mono" x="276" y="163" font-size="12.5" text-anchor="end" fill="#7f97bd">44.1%</text><rect x="48" y="170" width="228" height="3" rx="1.5" fill="#16223a"/><rect x="48" y="170" width="228.0" height="3" rx="1.5" fill="#3572A5" style="transform-origin:48px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.00s both"/></g>
    <g style="opacity:0;animation:rise .55s ease-out 0.07s forwards"><circle cx="323" cy="158" r="5.5" fill="#3178c6"/><text class="sans" x="338" y="163" font-size="14" font-weight="600" fill="#dbe6f5">TypeScript</text><text class="mono" x="566" y="163" font-size="12.5" text-anchor="end" fill="#7f97bd">27.5%</text><rect x="338" y="170" width="228" height="3" rx="1.5" fill="#16223a"/><rect x="338" y="170" width="142.2" height="3" rx="1.5" fill="#3178c6" style="transform-origin:338px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.07s both"/></g>
    <g style="opacity:0;animation:rise .55s ease-out 0.14s forwards"><circle cx="33" cy="196" r="5.5" fill="#f1e05a"/><text class="sans" x="48" y="201" font-size="14" font-weight="600" fill="#dbe6f5">JavaScript</text><text class="mono" x="276" y="201" font-size="12.5" text-anchor="end" fill="#7f97bd">16.0%</text><rect x="48" y="208" width="228" height="3" rx="1.5" fill="#16223a"/><rect x="48" y="208" width="82.5" height="3" rx="1.5" fill="#f1e05a" style="transform-origin:48px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.14s both"/></g>
    <g style="opacity:0;animation:rise .55s ease-out 0.21s forwards"><circle cx="323" cy="196" r="5.5" fill="#3d8137"/><text class="sans" x="338" y="201" font-size="14" font-weight="600" fill="#dbe6f5">Nunjucks</text><text class="mono" x="566" y="201" font-size="12.5" text-anchor="end" fill="#7f97bd">11.6%</text><rect x="338" y="208" width="228" height="3" rx="1.5" fill="#16223a"/><rect x="338" y="208" width="59.7" height="3" rx="1.5" fill="#3d8137" style="transform-origin:338px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.21s both"/></g>
    <g style="opacity:0;animation:rise .55s ease-out 0.28s forwards"><circle cx="33" cy="234" r="5.5" fill="#336790"/><text class="sans" x="48" y="239" font-size="14" font-weight="600" fill="#dbe6f5">PLpgSQL</text><text class="mono" x="276" y="239" font-size="12.5" text-anchor="end" fill="#7f97bd">0.7%</text><rect x="48" y="246" width="228" height="3" rx="1.5" fill="#16223a"/><rect x="48" y="246" width="3.4" height="3" rx="1.5" fill="#336790" style="transform-origin:48px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.28s both"/></g>
    <g style="opacity:0;animation:rise .55s ease-out 0.35s forwards"><circle cx="323" cy="234" r="5.5" fill="#178600"/><text class="sans" x="338" y="239" font-size="14" font-weight="600" fill="#dbe6f5">C#</text><text class="mono" x="566" y="239" font-size="12.5" text-anchor="end" fill="#7f97bd">0.1%</text><rect x="338" y="246" width="228" height="3" rx="1.5" fill="#16223a"/><rect x="338" y="246" width="0.5" height="3" rx="1.5" fill="#178600" style="transform-origin:338px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.35s both"/></g>
    <g style="opacity:0;animation:rise .55s ease-out 0.42s forwards"><circle cx="33" cy="272" r="5.5" fill="#7dd3fc"/><text class="sans" x="48" y="277" font-size="14" font-weight="600" fill="#dbe6f5">Other</text><text class="mono" x="276" y="277" font-size="12.5" text-anchor="end" fill="#7f97bd">0.1%</text><rect x="48" y="284" width="228" height="3" rx="1.5" fill="#16223a"/><rect x="48" y="284" width="0.4" height="3" rx="1.5" fill="#7dd3fc" style="transform-origin:48px 0;animation:grow .8s cubic-bezier(.2,.8,.2,1) 0.42s both"/></g>
    <rect x="0.5" y="0.5" width="619" height="329" rx="16" fill="none" stroke="#1e2b45"/>
  </g>
</svg>
